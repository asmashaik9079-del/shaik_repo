<!DOCTYPE html>
<html>
<head>
    <title>Static Webpage</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
            background-color: lightblue;
        }

        button {
            padding: 10px 20px;
        }
    </style>
</head>
<body>

    <h1>Welcome</h1>
    <p>This is a simple static webpage.</p>

    <button onclick="showMessage()">Click Me</button>

    <script>
        function showMessage() {
            alert("Hello! Welcome to my webpage.");
        }
    </script>

</body>
</html>
